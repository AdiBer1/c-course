# Posts the score of a check run as ONE comment on the pull request and
# updates that same comment on every new push.
#
# Security model:
#   - runs from main (workflow_run), so a PR cannot change this file
#   - never checks out or runs PR code
#   - the artifact from the check run is untrusted data: it is size-limited,
#     parsed, validated field by field, and the comment text is built here
#     from those values (the uploaded markdown is never posted)
#   - the PR number from the artifact must belong to the PR whose head commit
#     was checked, otherwise nothing is posted
#   - `actions: read` is needed only to download the artifact
name: Score comment

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the check result (untrusted)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: score
          path: ${{ runner.temp }}/score
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the score comment
        uses: actions/github-script@v7
        env:
          RESULT_DIR: ${{ runner.temp }}/score
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = context.payload.workflow_run;
            const MARKER = '<!-- c-course-score -->';
            const dir = process.env.RESULT_DIR;

            // ---------- read untrusted files safely
            function readSmall(name, maxBytes) {
              const p = path.join(dir, name);
              try {
                const st = fs.lstatSync(p);
                if (!st.isFile() || st.size > maxBytes) return null;
                return fs.readFileSync(p, 'utf8');
              } catch { return null; }
            }
            function readJson(name) {
              const t = readSmall(name, 64 * 1024);
              if (t === null) return null;
              try { return JSON.parse(t); } catch { return null; }
            }
            const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
            const isBool = (v) => typeof v === 'boolean';
            const safeName = (s) => typeof s === 'string' && /^[A-Za-z0-9._\/ -]{1,200}$/.test(s) ? s : '(unusual file name)';

            // ---------- which PR? (must match the checked commit)
            const prText = (readSmall('pr-number.txt', 32) || '').trim();
            if (!/^[0-9]{1,7}$/.test(prText)) { core.info('No valid PR number; nothing to do.'); return; }
            const prNumber = Number(prText);
            const { owner, repo } = context.repo;
            let pr;
            try { pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data; }
            catch { core.info('PR not found; nothing to do.'); return; }
            if (pr.head.sha !== run.head_sha) { core.info('PR head does not match the checked commit; skipping.'); return; }
            if (pr.state !== 'open') { core.info('PR is closed; skipping.'); return; }

            // ---------- independent check: only task src/ and ANSWERS.md may change
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
            const protectedChanged = files
              .flatMap(f => [f.filename, f.previous_filename].filter(Boolean))
              .filter(n => !/^tasks\/[^\/]+\/(src\/[^\/]+|ANSWERS\.md)$/.test(n));
            // Task numbers this PR really touches (from GitHub, not from the artifact).
            const taskNums = [...new Set(files.map(f => (f.filename.match(/^tasks\/(\d{2})-[^\/]+\//) || [])[1]).filter(Boolean))];

            // ---------- validate the score
            function validScore(s) {
              if (!s || typeof s !== 'object' || s.version !== 1) return false;
              if (typeof s.task !== 'string' || !/^[0-9]{2}-[a-z0-9-]{1,40}$/.test(s.task)) return false;
              if (!isInt(s.stage, 0, 6) || !isBool(s.compiled) || !isInt(s.total, 0, 100)) return false;
              const t = s.tests, q = s.quality;
              if (!t || !isInt(t.points, 0, 70) || !isInt(t.passed, 0, 1000) || !isInt(t.total, 0, 1000) || t.passed > t.total) return false;
              if (!isBool(t.timed_out) || !isBool(t.crashed) || !Array.isArray(t.failed) || t.failed.length > 1000) return false;
              if (!t.failed.every(n => typeof n === 'string' && /^test_[A-Za-z0-9_]{1,120}$/.test(n))) return false;
              if (!q || !isInt(q.points, 0, 30) || !q.deductions || typeof q.deductions !== 'object') return false;
              const keys = ['compiler_warnings', 'cppcheck', 'sanitizer_reports', 'forbidden_symbols', 'answers_empty'];
              if (Object.keys(q.deductions).sort().join() !== [...keys].sort().join()) return false;
              for (const k of keys) {
                const d = q.deductions[k];
                if (!d || !isInt(d.count, 0, 10000) || !isInt(d.each, 0, 100) || !isInt(d.points, 0, 1000000)) return false;
              }
              if (!isBool(q.deductions.cppcheck.active)) return false;
              if (s.compiled && s.total !== t.points + q.points) return false;
              if (!s.compiled && s.total !== 0) return false;
              return true;
            }

            const score = readJson('score.json');
            const guard = readJson('guard.json');
            const short = run.head_sha.slice(0, 7);
            const runLink = `[check run](${run.html_url})`;
            let body = `${MARKER}\n`;
            let passedNow = false; // valid score >= 60 and no protected files changed

            if (protectedChanged.length > 0) {
              body += `## ⚠️ This PR changes protected files\n\n`;
              body += `Only \`tasks/<task>/src/\` files listed in the task and \`ANSWERS.md\` may change. `;
              body += `Any score for this PR is **not valid** until these changes are undone:\n\n`;
              for (const n of protectedChanged.slice(0, 30)) body += `- \`${safeName(n)}\`\n`;
              if (protectedChanged.length > 30) body += `- … and ${protectedChanged.length - 30} more\n`;
              body += `\nUndo them (\`git checkout upstream/main -- <file>\`), commit and push again. Details: ${runLink}.\n`;
            } else if (score && validScore(score)) {
              const s = score, t = s.tests, q = s.quality, d = q.deductions;
              const ok = s.total >= 60;
              passedNow = ok && protectedChanged.length === 0;
              const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
              const minus = (v) => (v.points > 0 ? ` (−${v.points})` : '');

              body += `## Automated grading — Task ${s.task.slice(0, 2)}\n\n`;
              body += `\`${s.task}\` · stage ${s.stage} · commit \`${short}\`\n\n`;
              body += `| Category | Score |\n|---|---|\n`;
              body += `| Unit tests | ${t.points}/70 |\n`;
              body += `| Code quality | ${q.points}/30 |\n`;
              body += `| **Total** | **${s.total}/100** |\n\n`;
              body += ok ? `**Status: PASSED ✅**\n\n` : `**Status: NEEDS FIX ❌** (below 60)\n\n`;

              const fb = [];
              if (!s.compiled) {
                fb.push(`❌ **Does not compile**, so the score is 0. Run \`make\` in the task folder and fix the **first** error.`);
              } else {
                fb.push('✅ Compilation successful');

                if (t.total > 0 && t.passed === t.total) fb.push(`✅ ${t.passed}/${t.total} tests passed`);
                else fb.push(`${t.passed === 0 ? '❌' : '⚠️'} ${t.passed}/${t.total} tests passed (failing tests listed below)`);
                if (t.timed_out) fb.push('⏱️ Some tests hit the 5-second limit: an infinite loop or very slow code');
                if (t.crashed) fb.push('💥 Some tests crashed: run `make test` to see where');

                const w = d.compiler_warnings;
                fb.push(w.count === 0 ? '✅ No compiler warnings' : `⚠️ ${plural(w.count, 'compiler warning')}${minus(w)}: run \`make\` and read ${w.count === 1 ? 'it' : 'them'}`);

                const san = d.sanitizer_reports;
                fb.push(san.count === 0
                  ? '✅ No memory errors, leaks or undefined behaviour (AddressSanitizer + UBSan)'
                  : `❌ ${plural(san.count, 'sanitizer report')}: memory error, leak or undefined behaviour${minus(san)}. \`make test\` shows the line`);

                const fs_ = d.forbidden_symbols;
                fb.push(fs_.count === 0 ? '✅ No forbidden functions' : `❌ ${plural(fs_.count, 'forbidden function')} used${minus(fs_)}: see the task README`);

                const c = d.cppcheck;
                if (c.ran === true) {
                  if (c.count === 0) fb.push('✅ No cppcheck findings');
                  else if (c.active) fb.push(`⚠️ ${plural(c.count, 'cppcheck finding')}${minus(c)}`);
                  else fb.push(`ℹ️ ${plural(c.count, 'cppcheck note')} (no points lost before stage 5, but worth fixing)`);
                }

                const a = s.answers;
                const answered = a && isInt(a.answered, 0, 100) && isInt(a.questions, 0, 100) ? ` (${a.answered}/${a.questions} answered)` : '';
                fb.push(d.answers_empty.count === 0
                  ? `✅ \`ANSWERS.md\` filled in${answered}`
                  : `⚠️ \`ANSWERS.md\` is empty${minus(d.answers_empty)}`);
              }
              body += `**Feedback:**\n\n${fb.map(x => `- ${x}`).join('\n')}\n\n`;

              if (s.compiled && t.failed.length) {
                body += `<details><summary>Failing tests (${t.failed.length})</summary>\n\n`;
                for (const n of t.failed.slice(0, 40)) body += `- \`${n}\`\n`;
                if (t.failed.length > 40) body += `- … and ${t.failed.length - 40} more\n`;
                body += `\n</details>\n\n`;
              }

              body += ok
                ? `**Next step:** schedule your oral defense. Be ready to explain every line.\n`
                : `**Next step:** keep working. Run \`make score\` locally, then push again; this comment updates itself.\n`;
              body += `\nDetails (warning texts, sanitizer locations, test messages): ${runLink} → Summary.\n`;
            } else if (guard && typeof guard === 'object' && guard.ok === false) {
              const list = Array.isArray(guard.files) ? guard.files.slice(0, 30).map(safeName) : [];
              body += `## ❌ Not scored\n\n`;
              if (guard.reason === 'multiple_tasks') {
                body += `This PR touches more than one task. **One PR = exactly one task.** Tasks touched:\n\n`;
              } else if (guard.reason === 'no_task') {
                body += `This PR does not change any task folder. Files changed:\n\n`;
              } else if (guard.reason === 'forbidden_files') {
                body += `This PR changes files that are not on the task's list of student files:\n\n`;
              } else {
                body += `The pre-checks failed.\n\n`;
              }
              for (const n of list) body += `- \`${n}\`\n`;
              body += `\nFix it, push again, and this comment updates. Details: ${runLink}.\n`;
            } else {
              body += `## ⚠️ No score\n\nThe check finished (\`${run.conclusion}\`) without a readable result. See the ${runLink}.\n`;
            }

            // ---------- PR title: "[Task 07] - Full Name"
            const title = typeof pr.title === 'string' ? pr.title : '';
            const tm = title.match(/^\[Task (\d{2})\] - (\S.*\S)$/u);
            if (!tm || title.length > 100) {
              body += `\n> ⚠️ **PR title:** please rename it to \`[Task NN] - Full Name\`, e.g. \`[Task 07] - Dana Cohen\`.\n`;
            } else if (taskNums.length === 1 && tm[1] !== taskNums[0]) {
              body += `\n> ⚠️ **PR title:** it says Task ${tm[1]}, but this PR changes task ${taskNums[0]}. Please fix the title.\n`;
            }

            // ---------- one comment per PR: update it if it exists
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const mine = comments.find(c => c.user && c.user.login === 'github-actions[bot]' && typeof c.body === 'string' && c.body.startsWith(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            // ---------- labels: task-NN (from the PR's real files) + status
            //   passed     valid score >= 60
            //   needs-fix  anything else
            //   defended   set by the teacher by hand; never changed here
            try {
              const current = (pr.labels || []).map(l => l.name);
              const want = new Set();
              if (taskNums.length === 1) want.add(`task-${taskNums[0]}`);
              if (current.includes('defended')) {
                want.add('defended');
              } else {
                want.add(passedNow ? 'passed' : 'needs-fix');
              }
              const managed = n => /^task-\d{2}$/.test(n) || n === 'passed' || n === 'needs-fix';
              for (const n of current) {
                if (managed(n) && !want.has(n)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: n });
                }
              }
              const add = [...want].filter(n => !current.includes(n));
              if (add.length) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: add });
              }
            } catch (e) {
              core.warning(`Could not update labels: ${e.message}. Run scripts/setup-labels.sh once to create them.`);
            }
