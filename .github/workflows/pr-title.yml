# Checks the PR's title and description (the submission form):
#   Title Format   the title is  [Task 07] - Full Name
#   Description    "Full name:" in the form is filled in (required); the task
#                  number, checklist and reflection answers are reported as
#                  notes only
#
# Runs again on every edit of the title or description, so fixing them turns
# the checks green without a new push. It never checks out or runs PR code and
# needs no permissions; title and description reach the script only through
# environment variables, never pasted into it. It does not affect the score.
name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: PR Validation / Title Format
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title must be "[Task NN] - Full Name"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^\[Task ([0-9]{2})\] - ([^ ].*[^ ])$'
          if [[ ${#TITLE} -le 100 && $TITLE =~ $re ]]; then
            echo "OK: task ${BASH_REMATCH[1]}"
            exit 0
          fi
          # shellcheck disable=SC2016  # the backticks are meant literally
          {
            echo "### ❌ PR title has the wrong format"
            echo
            echo 'Use exactly: `[Task 07] - Full Name` (two-digit task number, space, dash, space, your full name).'
            echo
            echo "Edit the title at the top of the PR page; this check runs again by itself."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::PR title must look like: [Task 07] - Full Name"
          exit 1

  description:
    name: PR Validation / Description
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The form must contain your full name
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Drop carriage returns and <!-- comments --> (the template's hints).
          body=$(printf '%s' "$BODY" | tr -d '\r' | perl -0pe 's/<!--.*?-->//gs')
          field() {  # value after "Label:" (optionally **bold**), trimmed
            printf '%s\n' "$body" | sed -n "s/^[[:space:]]*\**$1:\**[[:space:]]*//p" | head -n1 | sed 's/[[:space:]]*$//'
          }
          name=$(field 'Full name')
          task=$(field 'Task number')
          unchecked=$(printf '%s\n' "$body" | grep -cE '^[[:space:]]*[-*] \[ \]' || true)
          # Reflection: count numbered questions that have some text after them.
          read -r questions answered < <(printf '%s\n' "$body" | awk '
            /^#+[[:space:]]*Reflection/ { on = 1; next }
            on && /^#/ { on = 0 }
            on && /^[[:space:]]*[0-9]+\.[[:space:]]/ { if (q) a += has; q++; has = 0; next }
            on && q && /[^[:space:]-]/ { has = 1 }
            END { if (q) a += has; printf "%d %d\n", q, a }')

          ok=true
          # A name: at least 2 characters, not only spaces or punctuation (Hebrew is fine).
          if [ ${#name} -lt 2 ] || [[ ! $name =~ [^[:space:][:punct:]] ]]; then ok=false; fi

          notes=()
          [ -n "$task" ] || notes+=("Task number is empty.")
          if [[ $TITLE =~ ^\[Task\ ([0-9]{2})\] ]] && [ -n "$task" ] && [ "$((10#${task//[^0-9]/0}))" != "$((10#${BASH_REMATCH[1]}))" ]; then
            notes+=("Task number in the form does not match the title.")
          fi
          [ "$unchecked" -eq 0 ] || notes+=("$unchecked checklist item(s) are not ticked.")
          [ "$questions" -eq 0 ] || [ "$answered" -eq "$questions" ] || notes+=("$((questions - answered)) of $questions reflection question(s) have no answer.")

          {
            if $ok; then
              echo "### ✅ PR description: PASSED"
              echo
              echo "Full name is filled in."
            else
              echo "### ❌ PR description: full name missing"
              echo
              # shellcheck disable=SC2016  # the backticks are meant literally
              echo 'Edit the PR description (the **...** menu on the first comment → **Edit**) and fill in the line `Full name: Your Name`. This check runs again by itself.'
            fi
            echo
            if [ ${#notes[@]} -gt 0 ]; then
              echo "**Please also complete** (these notes do not fail the check):"
              echo
              for n in "${notes[@]}"; do echo "- $n"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for n in "${notes[@]}"; do echo "::warning title=PR description::$n"; done
          if ! $ok; then
            echo "::error title=PR description::Fill in 'Full name:' in the PR description."
            exit 1
          fi
          echo "OK: full name given"
